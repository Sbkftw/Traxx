[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traxx"
version = "0.1.0"
description = "Incremental Spotify playlist sync to CSV and YouTube audio downloader."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "yt-dlp",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
traxx = "traxx_core.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["traxx_core*"]
